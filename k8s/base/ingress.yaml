apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devops-app
  namespace: devops
  labels:
    app: devops-app
spec:
  ingressClassName: traefik
  rules:
  - host: devops-app.localhost
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: devops-app
            port:
              number: 80
