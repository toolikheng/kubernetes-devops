apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: devops

resources:
- namespace.yaml
- serviceaccount.yaml
- configmap.yaml
- pvc.yaml
- service.yaml
- deployment.yaml
- ingress.yaml

commonLabels:
  app.kubernetes.io/name: devops-app
  app.kubernetes.io/version: "1.0"

commonAnnotations:
  app.kubernetes.io/managed-by: kustomize
